- defaults:
    link:
      create: true
      relink: true
      force: true
    clean:
      force: true

- shell:
    - description: PreSetup
      command: sh 'setup/pre-setup.sh'
      stdin: true
      stdout: true

- clean:
    - "~"

- link:
    # General config
    "~/.emacs": "./config/.emacs"
    "~/.lftp/rc": "./config/.lftp/rc"
    "~/.mertrc": "./config/.mertrc"
    "~/.tigrc": "./config/.tigrc"
    "~/.vimrc": "./config/.vimrc"

    # Shell config
    "~/.config/matejkosiarcik/config/config.bash": "./config/shell/config.bash"
    "~/.config/matejkosiarcik/config/config.sh": "./config/shell/config.sh"
    "~/.config/matejkosiarcik/config/config.zsh": "./config/shell/config.zsh"

    # Git config
    "~/.config/matejkosiarcik/config/main.gitconfig": "./config/git/main.gitconfig"

    # Scripts
    "~/.config/matejkosiarcik/bin/convert2pdf": "./scripts/convert2pdf/dist/convert.js"
    "~/.config/matejkosiarcik/bin/dir2sha": "./scripts/dir2sha.py"
    "~/.config/matejkosiarcik/bin/export-container": "./scripts/export-container.sh"
    "~/.config/matejkosiarcik/bin/export-image": "./scripts/export-image.sh"
    "~/.config/matejkosiarcik/bin/git-update": "./scripts/git-update.sh"
    "~/.config/matejkosiarcik/bin/mert-connect-to-server": "./scripts/mert-connect-to-server.sh"
    "~/.config/matejkosiarcik/bin/project-update": "./scripts/project-update/main.sh"
    "~/.config/matejkosiarcik/bin/system-update": "./scripts/system-update.sh"
    "~/.config/matejkosiarcik/bin/vscode-server": "./scripts/vscode-server.sh"

    # Old scripts
    # ~/.config/matejkosiarcik/bin/old/backup-packages: scripts/backup/backup-packages.sh
    # ~/.config/matejkosiarcik/bin/old/check-video: scripts/backup/check-video.sh
    # ~/.config/matejkosiarcik/bin/old/dir-clean: scripts/backup/dir-clean.sh
    # ~/.config/matejkosiarcik/bin/old/dirs2sha: scripts/backup/dirs2sha.sh
    # ~/.config/matejkosiarcik/bin/old/exifd: scripts/backup/exifd.sh
    # ~/.config/matejkosiarcik/bin/old/exiff: scripts/backup/exiff.sh
    # ~/.config/matejkosiarcik/bin/old/gitmon: scripts/backup/gitmon.sh
    # ~/.config/matejkosiarcik/bin/old/gitup: scripts/git/backup/gitup.sh
    # ~/.config/matejkosiarcik/bin/old/lsdir: scripts/backup/lsdir.py
    # ~/.config/matejkosiarcik/bin/old/newterm: scripts/backup/newterm.scpt
    # ~/.config/matejkosiarcik/bin/old/project-update: scripts/backup/project-update.sh
    # ~/.config/matejkosiarcik/bin/old/relock: scripts/backup/relock.sh
    # ~/.config/matejkosiarcik/bin/old/report-tabs: scripts/backup/report-tabs.sh
    # ~/.config/matejkosiarcik/bin/old/ulozto-autodownload: scripts/backup/ulozto-autodownload.sh

    # Background daemons
    "~/.config/matejkosiarcik/daemons/main.sh": "./daemons/main.sh"
    "~/.config/matejkosiarcik/daemons/photo-import/main.sh": "./daemons/photo-import/main.sh"
    "~/.config/matejkosiarcik/daemons/screenrecording-rename/main.sh": "./daemons/screenrecording-rename/main.sh"
    "~/.config/matejkosiarcik/daemons/screenshots-rename/main.sh": "./daemons/screenshots-rename/main.sh"

- shell:
    - description: Setup
      command: sh 'setup/setup.sh'
      stdin: true
      stdout: true
